<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes dash-flow { to { stroke-dashoffset: 0; } }
    .title { font-size: 30px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .role { font-size: 14px; font-style: italic; fill: #64748b; text-anchor: middle; }
    .edge-label { font-size: 15px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .edge {
      stroke: #475569;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 12 10;
      stroke-dashoffset: -22;
      animation: dash-flow 800ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1500" height="760" fill="#ffffff"/>
  <text class="title" x="750" y="52">End-to-End Trace: Flask → Celery → Tempo → Grafana</text>

  <!-- Client -->
  <g transform="translate(85,160)">
    <rect class="box" width="250" height="190" rx="24"/>
    <g transform="translate(105,30)">
      <rect width="40" height="32" rx="4" fill="#0f172a"/>
      <text x="6" y="22" fill="#22c55e" font-family="monospace" font-size="14">&gt;_</text>
    </g>
    <text class="role" x="125" y="120">POST /process</text>
  </g>

  <!-- Flask -->
  <g transform="translate(615,160)">
    <rect class="box" width="270" height="190" rx="24"/>
    <image href="./logos/flask-wordmark.svg" x="35" y="50" width="200" height="70"/>
    <text class="role" x="135" y="160">X-Trace-ID</text>
  </g>

  <!-- Redis -->
  <g transform="translate(1175,160)">
    <rect class="box" width="240" height="190" rx="24"/>
    <image href="./logos/redis.svg" x="60" y="25" width="120" height="120"/>
    <text class="role" x="120" y="170">broker</text>
  </g>

  <!-- Grafana -->
  <g transform="translate(85,500)">
    <rect class="box" width="250" height="200" rx="24"/>
    <image href="./logos/grafana-wordmark.svg" x="30" y="50" width="190" height="35"/>
    <image href="./logos/grafana-icon.svg" x="109" y="92" width="32" height="32"/>
    <text class="role" x="125" y="170">waterfall + service graph</text>
  </g>

  <!-- Tempo -->
  <g transform="translate(615,500)">
    <rect class="box" width="270" height="200" rx="24"/>
    <image href="./logos/tempo.svg" x="65" y="30" width="140" height="110"/>
    <text class="role" x="135" y="175">indexed by trace ID</text>
  </g>

  <!-- Celery worker -->
  <g transform="translate(1175,500)">
    <rect class="box" width="240" height="200" rx="24"/>
    <image href="./logos/celery.png" x="60" y="25" width="120" height="120"/>
    <text class="role" x="120" y="175">celery-process</text>
  </g>

  <line class="edge" x1="337" y1="255" x2="613" y2="255" marker-end="url(#arr)"/>
  <rect x="442" y="225" width="66" height="30" rx="15" fill="#ffffff"/>
  <text class="edge-label" x="475" y="245">HTTP</text>

  <line class="edge" x1="887" y1="255" x2="1173" y2="255" marker-end="url(#arr)"/>
  <rect x="982" y="225" width="92" height="30" rx="15" fill="#ffffff"/>
  <text class="edge-label" x="1028" y="245">enqueue</text>

  <line class="edge" x1="1295" y1="352" x2="1295" y2="498" marker-end="url(#arr)"/>
  <rect x="1232" y="406" width="126" height="30" rx="15" fill="#ffffff"/>
  <text class="edge-label" x="1295" y="427">pick up task</text>

  <line class="edge" x1="1173" y1="600" x2="887" y2="600" marker-end="url(#arr)"/>
  <rect x="982" y="572" width="92" height="30" rx="15" fill="#ffffff"/>
  <text class="edge-label" x="1028" y="592">export</text>

  <line class="edge" x1="613" y1="600" x2="337" y2="600" marker-end="url(#arr)"/>
  <rect x="426" y="572" width="98" height="30" rx="15" fill="#ffffff"/>
  <text class="edge-label" x="475" y="592">query</text>
</svg>