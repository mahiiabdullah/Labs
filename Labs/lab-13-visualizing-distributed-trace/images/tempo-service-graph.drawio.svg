<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes dash-flow { to { stroke-dashoffset: 0; } }
    .title { font-size: 28px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .edge-label { font-size: 14px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .edge {
      stroke: #475569;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 9 8;
      stroke-dashoffset: -17;
      animation: dash-flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1100" height="520" fill="#ffffff"/>
  <text class="title" x="550" y="48">Tempo Service Graph</text>

  <!-- flask-api -->
  <g transform="translate(160,170)">
    <rect class="box" width="240" height="180" rx="26"/>
    <image href="./logos/flask-wordmark.svg" x="20" y="55" width="200" height="70"/>
  </g>

  <!-- celery-worker -->
  <g transform="translate(700,170)">
    <rect class="box" width="240" height="180" rx="26"/>
    <image href="./logos/celery.png" x="60" y="30" width="120" height="120"/>
  </g>

  <line class="edge" x1="402" y1="260" x2="698" y2="260" marker-end="url(#arr)"/>
  <rect x="476" y="212" width="138" height="30" rx="15" fill="#ffffff"/>
  <text class="edge-label" x="545" y="232">requests</text>
</svg>