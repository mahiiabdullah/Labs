<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes dash-flow { to { stroke-dashoffset: 0; } }
    .title { font-size: 26px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .role { font-size: 14px; fill: #64748b; text-anchor: middle; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .edge {
      stroke: #475569;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 9 8;
      stroke-dashoffset: -17;
      animation: dash-flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1200" height="380" fill="#ffffff"/>
  <text class="title" x="600" y="40">Trace Context Propagation: Flask → Celery</text>

  <!-- Client -->
  <g transform="translate(40,110)">
    <rect class="box" width="160" height="220" rx="20"/>
    <g transform="translate(60,40)">
      <rect width="40" height="32" rx="4" fill="#0f172a"/>
      <text x="6" y="22" fill="#22c55e" font-family="monospace" font-size="14">&gt;_</text>
    </g>
    <text class="role" x="80" y="160" font-style="italic">POST /process</text>
  </g>

  <!-- Flask -->
  <g transform="translate(240,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/flask-wordmark.svg" x="20" y="55" width="140" height="50"/>
    <text class="role" x="90" y="160" font-style="italic">inject(carrier)</text>
  </g>

  <!-- Redis -->
  <g transform="translate(460,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/redis.svg" x="50" y="35" width="80" height="80"/>
    <text class="role" x="90" y="160" font-style="italic">broker</text>
  </g>

  <!-- Celery worker -->
  <g transform="translate(680,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/celery.png" x="50" y="35" width="80" height="80"/>
    <text class="role" x="90" y="160" font-style="italic">extract(carrier)</text>
  </g>

  <!-- Tempo -->
  <g transform="translate(900,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/tempo.svg" x="40" y="40" width="100" height="80"/>
    <text class="role" x="90" y="160" font-style="italic">:4318</text>
  </g>

  <line class="edge" x1="202" y1="220" x2="238" y2="220" marker-end="url(#arr)"/>
  <rect x="206" y="200" width="32" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="222" y="216">HTTP</text>

  <line class="edge" x1="422" y1="220" x2="458" y2="220" marker-end="url(#arr)"/>
  <rect x="420" y="200" width="44" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="442" y="216">enqueue</text>

  <line class="edge" x1="642" y1="220" x2="678" y2="220" marker-end="url(#arr)"/>
  <rect x="640" y="200" width="44" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="662" y="216">pick up</text>

  <line class="edge" x1="862" y1="220" x2="898" y2="220" marker-end="url(#arr)"/>
  <rect x="866" y="200" width="32" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="882" y="216">export</text>
</svg>