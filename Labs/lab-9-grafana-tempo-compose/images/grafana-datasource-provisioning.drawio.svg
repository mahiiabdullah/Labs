<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes dash-flow { to { stroke-dashoffset: 0; } }
    .title { font-size: 26px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .role { font-size: 14px; fill: #64748b; text-anchor: middle; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .edge {
      stroke: #475569;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 9 8;
      stroke-dashoffset: -17;
      animation: dash-flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1200" height="380" fill="#ffffff"/>
  <text class="title" x="600" y="40">Grafana Datasource Provisioning</text>

  <!-- YAML file -->
  <g transform="translate(80,110)">
    <rect class="box" width="200" height="220" rx="20"/>
    <g transform="translate(76,40)">
      <rect width="48" height="36" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <line x1="6" y1="10" x2="42" y2="10" stroke="#94a3b8" stroke-width="1"/>
      <line x1="6" y1="18" x2="42" y2="18" stroke="#94a3b8" stroke-width="1"/>
      <line x1="6" y1="26" x2="34" y2="26" stroke="#94a3b8" stroke-width="1"/>
    </g>
    <text class="role" x="100" y="160" font-weight="700">tempo.yaml</text>
    <text class="role" x="100" y="180" font-style="italic">provisioning file</text>
  </g>

  <!-- Grafana -->
  <g transform="translate(380,110)">
    <rect class="box" width="200" height="220" rx="20"/>
    <image href="./logos/grafana-wordmark.svg" x="25" y="55" width="150" height="25"/>
    <image href="./logos/grafana-icon.svg" x="84" y="90" width="32" height="32"/>
    <text class="role" x="100" y="170" font-style="italic">startup scan</text>
  </g>

  <!-- Datasource registered -->
  <g transform="translate(680,110)">
    <rect class="box" width="200" height="220" rx="20"/>
    <g transform="translate(80,50)">
      <rect width="40" height="32" rx="6" fill="#0f172a"/>
      <text x="20" y="22" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">{ }</text>
    </g>
    <text class="role" x="100" y="160" font-weight="700">Datasource</text>
    <text class="role" x="100" y="180" font-style="italic">name: Tempo</text>
  </g>

  <!-- Explore UI -->
  <g transform="translate(980,110)">
    <rect class="box" width="200" height="220" rx="20"/>
    <g transform="translate(72,40)">
      <rect width="56" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="6" y="6" width="44" height="6" rx="2" fill="#f46800"/>
      <rect x="6" y="16" width="44" height="3" rx="1" fill="#cbd5e1"/>
      <rect x="6" y="22" width="32" height="3" rx="1" fill="#cbd5e1"/>
    </g>
    <text class="role" x="100" y="160" font-weight="700">Explore UI</text>
    <text class="role" x="100" y="180" font-style="italic">http://LB_IP:3000</text>
  </g>

  <line class="edge" x1="282" y1="220" x2="378" y2="220" marker-end="url(#arr)"/>
  <rect x="298" y="200" width="64" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="330" y="216">mount :ro</text>

  <line class="edge" x1="582" y1="220" x2="678" y2="220" marker-end="url(#arr)"/>
  <rect x="604" y="200" width="52" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="630" y="216">register</text>

  <line class="edge" x1="882" y1="220" x2="978" y2="220" marker-end="url(#arr)"/>
  <rect x="906" y="200" width="48" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="930" y="216">select</text>
</svg>