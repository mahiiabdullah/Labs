<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes flow { to { stroke-dashoffset: 0; } }
    .diagram-title { font-size: 28px; font-weight: 600; fill: #172033; text-anchor: middle; }
    .zone-label { font-size: 18px; font-weight: 600; fill: #172033; text-anchor: middle; }
    .box-title { font-size: 18px; font-weight: 600; fill: #172033; text-anchor: middle; }
    .box-sub { font-size: 14px; fill: #475569; text-anchor: middle; }
    .cmd { font-size: 14px; font-weight: 600; fill: #334155; text-anchor: middle; }
    .zone { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .box { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
    .edge {
      stroke: #334155;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 6;
      stroke-dashoffset: -14;
      animation: flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
  </defs>

  <rect width="900" height="720" fill="#ffffff"/>

  <!-- Diagram title -->
  <text class="diagram-title" x="450" y="40">Grafana Datasource Provisioning</text>

  <!-- Top zone: mount + scan -->
  <rect class="zone" x="40" y="80" width="820" height="280" rx="24"/>
  <text class="zone-label" x="450" y="120">Mount + scan</text>

  <!-- Box: tempo.yaml (top-left) -->
  <rect class="box" x="80" y="170" width="280" height="160" rx="20"/>
  <text class="box-title" x="220" y="225">tempo.yaml</text>
  <text class="box-sub" x="220" y="260">provisioning file</text>

  <!-- Box: Grafana container (top-right) -->
  <rect class="box" x="540" y="170" width="280" height="160" rx="20"/>
  <text class="box-title" x="680" y="225">Grafana container</text>
  <text class="box-sub" x="680" y="260">startup scan</text>

  <!-- Arrow 1: tempo.yaml -> Grafana container (top row, right) -->
  <line class="edge" x1="362" y1="250" x2="538" y2="250" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="240">/etc/grafana/provisioning</text>

  <!-- Bottom zone: register + use -->
  <rect class="zone" x="40" y="400" width="820" height="280" rx="24"/>
  <text class="zone-label" x="450" y="440">Register + use</text>

  <!-- Box: Datasource (bottom-left) -->
  <rect class="box" x="80" y="490" width="280" height="160" rx="20"/>
  <text class="box-title" x="220" y="545">Datasource</text>
  <text class="box-sub" x="220" y="580">name: Tempo</text>

  <!-- Box: Explore UI (bottom-right) -->
  <rect class="box" x="540" y="490" width="280" height="160" rx="20"/>
  <text class="box-title" x="680" y="545">Explore UI</text>
  <text class="box-sub" x="680" y="580">query by trace ID</text>

  <!-- Arrow 2: Grafana container -> Datasource (down + left cross-zone) -->
  <path class="edge" d="M 680 332 L 680 400 L 220 400 L 220 488" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="393">register</text>

  <!-- Arrow 3: Datasource -> Explore UI (bottom row, right) -->
  <line class="edge" x1="362" y1="570" x2="538" y2="570" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="560">select Tempo</text>
</svg>