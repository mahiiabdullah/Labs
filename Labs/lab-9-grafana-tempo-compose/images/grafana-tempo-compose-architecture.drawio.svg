<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes flow { to { stroke-dashoffset: 0; } }
    .diagram-title { font-size: 28px; font-weight: 600; fill: #172033; text-anchor: middle; }
    .zone-label { font-size: 18px; font-weight: 600; fill: #172033; text-anchor: middle; }
    .box-title { font-size: 18px; font-weight: 600; fill: #172033; text-anchor: middle; }
    .box-sub { font-size: 14px; fill: #475569; text-anchor: middle; }
    .cmd { font-size: 14px; font-weight: 600; fill: #1e3a8a; text-anchor: middle; }
    .zone { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
    .box { fill: #bfdbfe; stroke: #60a5fa; stroke-width: 1.5; }
    .edge {
      stroke: #1e3a8a;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 6;
      stroke-dashoffset: -14;
      animation: flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e3a8a"/></marker>
  </defs>

  <rect width="900" height="720" fill="#ffffff"/>

  <!-- Diagram title -->
  <text class="diagram-title" x="450" y="40">Grafana + Tempo Trace Architecture</text>

  <!-- Top zone: send + receive -->
  <rect class="zone" x="40" y="80" width="820" height="280" rx="24"/>
  <text class="zone-label" x="450" y="120">Send + receive path</text>

  <!-- Box: curl client (top-left) -->
  <rect class="box" x="80" y="170" width="280" height="160" rx="20"/>
  <text class="box-title" x="220" y="225">curl client</text>
  <text class="box-sub" x="220" y="260">OTLP HTTP POST</text>

  <!-- Box: Tempo receiver (top-right) -->
  <rect class="box" x="540" y="170" width="280" height="160" rx="20"/>
  <text class="box-title" x="680" y="225">Tempo receiver</text>
  <text class="box-sub" x="680" y="260">listening on :4318</text>

  <!-- Arrow 1: curl client -> Tempo receiver (top row, right) -->
  <line class="edge" x1="362" y1="250" x2="538" y2="250" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="240">POST :4318</text>

  <!-- Bottom zone: store + visualize -->
  <rect class="zone" x="40" y="400" width="820" height="280" rx="24"/>
  <text class="zone-label" x="450" y="440">Store + visualize</text>

  <!-- Box: Grafana Explore (bottom-left) -->
  <rect class="box" x="80" y="490" width="280" height="160" rx="20"/>
  <text class="box-title" x="220" y="545">Grafana Explore</text>
  <text class="box-sub" x="220" y="580">query by trace ID</text>

  <!-- Box: Tempo storage (bottom-right) -->
  <rect class="box" x="540" y="490" width="280" height="160" rx="20"/>
  <text class="box-title" x="680" y="545">Tempo storage</text>
  <text class="box-sub" x="680" y="580">local trace backend</text>

  <!-- Arrow 2: Tempo receiver (right column top) -> Tempo storage (right column bottom) -->
  <line class="edge" x1="680" y1="332" x2="680" y2="488" marker-end="url(#arr)"/>
  <text class="cmd" x="700" y="415">write</text>

  <!-- Arrow 3: Tempo storage -> Grafana Explore (bottom row, left) -->
  <line class="edge" x1="538" y1="570" x2="362" y2="570" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="560">query :3200</text>
</svg>