<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes flow { to { stroke-dashoffset: 0; } }
    .diagram-title { font-size: 24px; font-weight: 600; fill: #111827; text-anchor: middle; }
    .zone-title { font-size: 18px; font-weight: 600; fill: #111827; text-anchor: middle; }
    .box-title { font-size: 17px; font-weight: 600; fill: #111827; text-anchor: middle; }
    .box-sub { font-size: 13px; fill: #374151; text-anchor: middle; }
    .cmd { font-size: 13px; font-weight: 600; fill: #111827; text-anchor: middle; }
    .zone-outer { fill: #d1fae5; stroke: #6ee7b7; stroke-width: 1.5; }
    .zone-inner { fill: #a7f3d0; stroke: #34d399; stroke-width: 1.5; }
    .edge {
      stroke: #4b5563;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 6;
      stroke-dashoffset: -14;
      animation: flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4b5563"/></marker>
  </defs>

  <rect width="900" height="860" fill="#ffffff"/>

  <!-- Diagram title -->
  <text class="diagram-title" x="450" y="46">OpenTelemetry Auto-Instrumentation Flow</text>

  <!-- Top zone: App process (y: 80-350) -->
  <rect class="zone-outer" x="40" y="80" width="820" height="270" rx="28"/>
  <text class="zone-title" x="450" y="115">App process</text>

  <!-- Bottom zone: Backend (y: 390-690) -->
  <rect class="zone-outer" x="40" y="390" width="820" height="300" rx="28"/>
  <text class="zone-title" x="450" y="425">Backend</text>

  <!-- ===== Top row: y=155..315 ===== -->
  <!-- Box 1: Flask app (x: 80..300) -->
  <rect class="zone-inner" x="80" y="155" width="220" height="160" rx="20"/>
  <text class="box-title" x="190" y="220">Flask app</text>
  <text class="box-sub" x="190" y="250">GET /hello</text>

  <!-- Box 2: opentelemetry-instrument (x: 600..820) -->
  <rect class="zone-inner" x="600" y="155" width="220" height="160" rx="20"/>
  <text class="box-title" x="710" y="220">opentelemetry-instrument</text>
  <text class="box-sub" x="710" y="250">wraps Flask process</text>

  <!-- ===== Bottom row: y=465..625 ===== -->
  <!-- Box 3: OTLP exporter (x: 80..300) -->
  <rect class="zone-inner" x="80" y="465" width="220" height="160" rx="20"/>
  <text class="box-title" x="190" y="530">OTLP exporter</text>
  <text class="box-sub" x="190" y="560">POST /v1/traces</text>

  <!-- Box 4: Tempo receiver (x: 600..820) -->
  <rect class="zone-inner" x="600" y="465" width="220" height="160" rx="20"/>
  <text class="box-title" x="710" y="530">Tempo receiver</text>
  <text class="box-sub" x="710" y="560">:4318 local store</text>

  <!-- ===== Arrow 1: Flask app -> opentelemetry-instrument (top row, mid-height y=235) ===== -->
  <line class="edge" x1="302" y1="235" x2="598" y2="235" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="225">boot</text>

  <!-- ===== Arrow 2: opentelemetry-instrument (bottom) -> Tempo receiver (top) ===== -->
  <!-- exits bottom-center of box 2 (x=710, y=317), enters top-center of box 4 (x=710, y=463) -->
  <line class="edge" x1="710" y1="317" x2="710" y2="463" marker-end="url(#arr)"/>
  <text class="cmd" x="730" y="395">export</text>

  <!-- ===== Arrow 3: Tempo receiver -> OTLP exporter (bottom row, mid-height y=545) ===== -->
  <line class="edge" x1="598" y1="545" x2="302" y2="545" marker-end="url(#arr)"/>
  <text class="cmd" x="450" y="535">ack 200</text>

  <!-- ===== Box 5: Grafana Explore (outside Backend zone, directly under Tempo receiver) ===== -->
  <rect class="zone-inner" x="600" y="730" width="220" height="100" rx="20"/>
  <text class="box-title" x="710" y="770">Grafana Explore</text>
  <text class="box-sub" x="710" y="798">query by trace ID</text>

  <!-- ===== Arrow 4: Tempo receiver -> Grafana Explore (straight down, in the gap between zones) ===== -->
  <line class="edge" x1="710" y1="627" x2="710" y2="728" marker-end="url(#arr)"/>
  <text class="cmd" x="730" y="685">GET /trace</text>
</svg>