<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes dash-flow { to { stroke-dashoffset: 0; } }
    .title { font-size: 26px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .role { font-size: 14px; fill: #64748b; text-anchor: middle; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .edge {
      stroke: #475569;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 9 8;
      stroke-dashoffset: -17;
      animation: dash-flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1200" height="380" fill="#ffffff"/>
  <text class="title" x="600" y="40">OpenTelemetry Auto-Instrumentation Flow</text>

  <!-- Flask -->
  <g transform="translate(60,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/flask-wordmark.svg" x="20" y="55" width="140" height="50"/>
    <text class="role" x="90" y="150" font-style="italic">GET /hello</text>
  </g>

  <!-- OTel wrapper -->
  <g transform="translate(280,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/otel.svg" x="20" y="40" width="140" height="60"/>
    <text class="role" x="90" y="150" font-style="italic">opentelemetry-instrument</text>
  </g>

  <!-- OTLP exporter -->
  <g transform="translate(500,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <g transform="translate(70,40)">
      <rect x="0" y="6" width="40" height="28" rx="3" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
      <line x1="8" y1="14" x2="32" y2="14" stroke="#06b6d4" stroke-width="2"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#06b6d4" stroke-width="2"/>
      <line x1="8" y1="28" x2="22" y2="28" stroke="#06b6d4" stroke-width="2"/>
    </g>
    <text class="role" x="90" y="135" font-weight="700">OTLP HTTP</text>
    <text class="role" x="90" y="155" font-style="italic">POST /v1/traces</text>
  </g>

  <!-- Tempo -->
  <g transform="translate(720,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/tempo.svg" x="40" y="40" width="100" height="80"/>
    <text class="role" x="90" y="160" font-style="italic">:4318</text>
  </g>

  <!-- Grafana -->
  <g transform="translate(940,110)">
    <rect class="box" width="180" height="220" rx="20"/>
    <image href="./logos/grafana-wordmark.svg" x="20" y="55" width="140" height="22"/>
    <image href="./logos/grafana-icon.svg" x="74" y="85" width="32" height="32"/>
    <text class="role" x="90" y="165" font-style="italic">Explore</text>
  </g>

  <line class="edge" x1="242" y1="220" x2="278" y2="220" marker-end="url(#arr)"/>
  <rect x="240" y="200" width="44" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="262" y="216">import</text>

  <line class="edge" x1="462" y1="220" x2="498" y2="220" marker-end="url(#arr)"/>
  <rect x="464" y="200" width="36" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="482" y="216">span</text>

  <line class="edge" x1="682" y1="220" x2="718" y2="220" marker-end="url(#arr)"/>
  <rect x="668" y="200" width="64" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="700" y="216">http/proto</text>

  <line class="edge" x1="902" y1="220" x2="938" y2="220" marker-end="url(#arr)"/>
  <rect x="908" y="200" width="26" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="921" y="216">:3200</text>
</svg>