<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes dash-flow { to { stroke-dashoffset: 0; } }
    .title { font-size: 26px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .span-name { font-size: 18px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .tree {
      stroke: #475569;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 9 8;
      stroke-dashoffset: -17;
      animation: dash-flow 700ms linear infinite;
      fill: none;
    }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1100" height="500" fill="#ffffff"/>
  <text class="title" x="550" y="40">Manual Span Hierarchy</text>

  <!-- Root -->
  <g transform="translate(390,90)">
    <rect class="box" width="320" height="140" rx="18"/>
    <image href="./logos/flask-icon.png" x="40" y="35" width="70" height="70"/>
    <text class="span-name" x="220" y="80">handle_request</text>
  </g>

  <!-- db_lookup -->
  <g transform="translate(120,340)">
    <rect class="box" width="320" height="140" rx="18"/>
    <g transform="translate(40,40)">
      <ellipse cx="16" cy="6" rx="14" ry="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <path d="M2 6 v22 a14 5 0 0 0 28 0 v-22" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <ellipse cx="16" cy="18" rx="14" ry="5" fill="none" stroke="#1f2937" stroke-width="2"/>
    </g>
    <text class="span-name" x="220" y="80">db_lookup</text>
  </g>

  <!-- cache_check -->
  <g transform="translate(660,340)">
    <rect class="box" width="320" height="140" rx="18"/>
    <g transform="translate(40,40)">
      <rect x="2" y="4" width="28" height="28" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <line x1="2" y1="14" x2="30" y2="14" stroke="#1f2937" stroke-width="2"/>
      <line x1="2" y1="24" x2="30" y2="24" stroke="#1f2937" stroke-width="2"/>
    </g>
    <text class="span-name" x="220" y="80">cache_check</text>
  </g>

  <line class="tree" x1="550" y1="232" x2="550" y2="298" marker-end="url(#arr)"/>
  <line class="tree" x1="280" y1="300" x2="820" y2="300"/>
  <line class="tree" x1="280" y1="300" x2="280" y2="338" marker-end="url(#arr)"/>
  <line class="tree" x1="820" y1="300" x2="820" y2="338" marker-end="url(#arr)"/>

  <circle cx="550" cy="300" r="5" fill="#475569"/>
  <circle cx="280" cy="300" r="5" fill="#475569"/>
  <circle cx="820" cy="300" r="5" fill="#475569"/>
</svg>