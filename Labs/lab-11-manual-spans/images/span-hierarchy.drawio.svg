<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    @keyframes flow { to { stroke-dashoffset: 0; } }
    .diagram-title { font-size: 26px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .box-title { font-size: 18px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .box-sub { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .cmd { font-size: 13px; font-weight: 600; fill: #111827; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .edge {
      stroke: #475569;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 6;
      stroke-dashoffset: -14;
      animation: flow 700ms linear infinite;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>
  <text class="diagram-title" x="550" y="50">Manual Span Hierarchy</text>

  <!-- Root: handle_request (top, centered) — no logo, title dead-center -->
  <g transform="translate(440,100)">
    <rect class="box" width="220" height="120" rx="18"/>
    <text class="box-title" x="110" y="55">handle_request</text>
    <text class="box-sub" x="110" y="80">root span · my-api</text>
  </g>

  <!-- db_lookup (bottom-left) -->
  <g transform="translate(140,420)">
    <rect class="box" width="320" height="180" rx="18"/>
    <text class="box-title" x="160" y="85">db_lookup</text>
    <text class="box-sub" x="160" y="115">SELECT * FROM users</text>
  </g>

  <!-- cache_check (bottom-right) -->
  <g transform="translate(640,420)">
    <rect class="box" width="320" height="180" rx="18"/>
    <text class="box-title" x="160" y="85">cache_check</text>
    <text class="box-sub" x="160" y="115">GET key:user:42</text>
  </g>

  <!-- Arrow 1: handle_request -> junction (down) -->
  <line class="edge" x1="550" y1="222" x2="550" y2="358" marker-end="url(#arr)"/>
  <text class="cmd" x="585" y="295">start span</text>

  <!-- Horizontal junction at y=360 -->
  <line class="edge" x1="300" y1="360" x2="800" y2="360"/>

  <!-- Arrow 2: junction -> db_lookup (down) -->
  <line class="edge" x1="300" y1="360" x2="300" y2="418" marker-end="url(#arr)"/>
  <text class="cmd" x="300" y="395">child</text>

  <!-- Arrow 3: junction -> cache_check (down) -->
  <line class="edge" x1="800" y1="360" x2="800" y2="418" marker-end="url(#arr)"/>
  <text class="cmd" x="800" y="395">child</text>
</svg>