<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #172033; text-anchor: middle; }
    .panel-title { font-size: 14px; font-weight: 700; fill: #172033; }
    .panel-sub { font-size: 12px; fill: #64748b; }
    .section-name { font-size: 15px; font-weight: 700; fill: #172033; }
    .section-sub { font-size: 12px; fill: #64748b; }
    .key { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .value { font-size: 13px; fill: #16a34a; font-family: Menlo, Consolas, monospace; }
  </style>

  <rect width="1100" height="560" fill="#ffffff"/>
  <text class="title" x="550" y="40">Tempo Span Attribute Panel</text>

  <rect x="40" y="80" width="1020" height="450" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="80" width="1020" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text class="panel-title" x="60" y="106">Span attributes</text>
  <text class="panel-sub" x="900" y="106">service.name = my-api</text>

  <text class="section-name" x="60" y="148">handle_request</text>
  <text class="section-sub" x="240" y="148">root span</text>
  <rect x="60" y="158" width="980" height="90" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text class="key" x="80" y="183">user.id</text>
  <text class="value" x="380" y="183">"u-42"</text>
  <text class="key" x="80" y="208">request.id</text>
  <text class="value" x="380" y="208">"r-1001"</text>
  <text class="key" x="80" y="233">span.kind</text>
  <text class="value" x="380" y="233">"internal"</text>

  <text class="section-name" x="60" y="270">db_lookup</text>
  <text class="section-sub" x="200" y="270">child of handle_request</text>
  <rect x="60" y="280" width="980" height="90" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text class="key" x="80" y="305">db.query_time_ms</text>
  <text class="value" x="380" y="305">30.12</text>
  <text class="key" x="80" y="330">db.system</text>
  <text class="value" x="380" y="330">"postgres"</text>
  <text class="key" x="80" y="355">span.kind</text>
  <text class="value" x="380" y="355">"internal"</text>

  <text class="section-name" x="60" y="392">cache_check</text>
  <text class="section-sub" x="220" y="392">child of handle_request</text>
  <rect x="60" y="402" width="980" height="90" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text class="key" x="80" y="427">cache.lookup_time_ms</text>
  <text class="value" x="380" y="427">10.04</text>
  <text class="key" x="80" y="452">cache.hit</text>
  <text class="value" x="380" y="452">false</text>
  <text class="key" x="80" y="477">span.kind</text>
  <text class="value" x="380" y="477">"internal"</text>
</svg>